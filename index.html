<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="NEXZA Digital Twin | FORTUNE — ต้นแบบติดตามระบบอาคารตามจุด (ข้อมูลจำลองหรือ API ที่กำหนด)" />
    <title>NEXZA Digital Twin | FORTUNE — เวอร์ชันทดลอง</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237a14d6'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e8f1ec'/%3E%3C/svg%3E" />
    <style>
      /* หน้าจอเริ่มต้น (แสดงก่อนสคริปต์โหลด ไม่ให้เห็นหน้าว่าง) — สีธีม NEXZA (ค่าเดียวกับ --nx-* ใน style.css) */
      .boot-screen { min-height: 100vh; display: grid; place-items: center; background: #f6fafd; color: #333333; font-family: Thonburi, Tahoma, Arial, "Noto Sans Thai", system-ui, sans-serif; text-align: center; padding: 16px; }
      .boot-screen .b-logo { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .boot-screen .b-logo img { height: 52px; width: auto; display: block; }
      .boot-screen .b-title { font-weight: 700; font-size: 1.05rem; }
      .boot-screen .b-spin { width: 40px; height: 40px; margin: 16px auto; border-radius: 50%; border: 4px solid #dce4ec; border-top-color: #7a14d6; animation: bspin 0.9s linear infinite; }
      .boot-screen p { margin: 0; color: #5a6570; font-size: 0.9rem; }
      @keyframes bspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-screen .b-spin { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <div class="boot-screen booting" role="status"><div><div class="b-logo"><img src="./brand/nexza-logo.png" alt="NEXZA" width="212" height="52" /><span class="b-title">Digital Twin | FORTUNE</span></div><div class="b-spin"></div><p>กำลังโหลดโมเดลอาคาร 3 มิติ…</p></div></div>
      <noscript>ต้องเปิด JavaScript เพื่อใช้งานแอปนี้</noscript>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
